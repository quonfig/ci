# SSDLC umbrella reusable workflow (SOC 2, epic qfg-66ko).
#
# Every in-scope repo calls this from a thin .github/workflows/ssdlc.yml on
# pull_request. Jobs here (all hotfix-aware):
#   sanity  - AI sanity check
#   secrets - gitleaks scan of the PR's commits (base..head)
#   deps    - osv-scanner HIGH/CRITICAL dependency vulnerability scan
#   sast    - Semgrep CE p/ci static analysis, ERROR severity only, diff-aware
#
# Required check names in a caller whose job id is `ssdlc`:
#   "ssdlc / sanity", "ssdlc / secrets", "ssdlc / deps", "ssdlc / sast".
name: ssdlc

on:
  workflow_call:
    inputs:
      max_changed_lines:
        description: Skip the AI (and pass) when additions+deletions exceed this.
        type: number
        default: 3000
      model:
        description: Claude model for the sanity check.
        type: string
        default: claude-haiku-4-5-20251001
      max_turns:
        description: Max agent turns for the sanity check.
        type: number
        default: 6
      deps:
        description: Run the dependency vulnerability scan (deps job).
        type: boolean
        default: true
      deps_enforce:
        description: >-
          Fail the deps check on unignored HIGH/CRITICAL findings. false =
          report-only (annotations + job summary, check passes). Rollout
          default is false until the existing backlog is fixed (qfg-66ko.3).
        type: boolean
        default: false
      sast:
        description: Run the Semgrep static analysis (sast job).
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  sanity:
    name: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Draft PRs are skipped entirely. Marking ready_for_review triggers a run.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    concurrency:
      group: ssdlc-sanity-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      HAS_HOTFIX: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}
      ACTOR: ${{ github.actor }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      ADDITIONS: ${{ github.event.pull_request.additions }}
      DELETIONS: ${{ github.event.pull_request.deletions }}
      MAX_CHANGED_LINES: ${{ inputs.max_changed_lines }}
    steps:
      - name: Decide mode
        id: mode
        run: |
          # hotfix     -> pass, post the justification request once
          # dependabot -> pass with a notice: Dependabot-triggered runs get no
          #               Actions secrets, so the AI cannot run (qfg-66ko.14)
          # mirror     -> a non-hotfix label changed: re-report the last verdict, no AI
          # review     -> run the AI sanity check (subject to the diff budget below)
          if [ "$HAS_HOTFIX" = "true" ]; then
            mode=hotfix
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            mode=dependabot
          elif { [ "$ACTION" = "labeled" ] || [ "$ACTION" = "unlabeled" ]; } && [ "$EVENT_LABEL" != "hotfix" ]; then
            mode=mirror
          else
            mode=review
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Sanity mode: $mode (action=$ACTION label=${EVENT_LABEL:-none} hotfix=$HAS_HOTFIX actor=$ACTOR)"

      - name: Hotfix override
        if: steps.mode.outputs.mode == 'hotfix'
        run: |
          marker='<!-- ssdlc-hotfix -->'
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))] | length" | awk '{s+=$1} END {print s+0}')
          if [ "$existing" -eq 0 ]; then
            body="$marker
          **Hotfix override applied.** The \`hotfix\` label overrides the SSDLC gates (AI sanity check skipped; secrets, dependency and static analysis findings reported but not enforced) so this PR is not blocked.

          Per the SSDLC policy, please, within **2 business days**:
          1. Reply on this PR with a short justification for bypassing the normal review.
          2. File a follow-up bead (\`bd create ...\`) for any review, tests or cleanup that were skipped, and link it here."
            # Fork PRs get a read-only token; the override must still pass.
            gh pr comment "$PR" --repo "$REPO" --body "$body" ||
              echo "::warning title=SSDLC sanity::could not post the hotfix comment (read-only token on a fork PR?); post the justification by hand"
          else
            echo "Hotfix comment already present; not posting again."
          fi
          echo "::notice title=SSDLC sanity::hotfix label present - check passes without AI review"

      - name: Dependabot PR
        if: steps.mode.outputs.mode == 'dependabot'
        run: |
          # Runs triggered by Dependabot only see Dependabot secrets, never
          # Actions secrets, so ANTHROPIC_API_KEY is unavailable. A dependency
          # bump is still gated by the deps, secrets and sast jobs. A human
          # pushing to the branch triggers a normal AI review.
          echo "::notice title=SSDLC sanity::Dependabot PR - AI sanity check skipped (Dependabot runs get no Actions secrets), check passes. The dependency change is still covered by the deps (osv-scanner), secrets (gitleaks) and sast (Semgrep) jobs."

      - name: Mirror previous verdict (non-hotfix label change)
        if: steps.mode.outputs.mode == 'mirror'
        id: mirror
        run: |
          # A label unrelated to hotfix changed. Do not re-run the AI. Re-report
          # the most recent completed sanity verdict on this commit so adding a
          # random label can never turn a BLOCK green.
          last=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select((.name == "sanity" or (.name | endswith("/ sanity"))) and (.conclusion == "success" or .conclusion == "failure"))] | sort_by(.completed_at) | last | .conclusion // ""')
          echo "Previous sanity conclusion on $HEAD_SHA: ${last:-none}"
          if [ "$last" = "failure" ]; then
            echo "::error title=SSDLC sanity::previous sanity check on this commit failed (BLOCK); a label change does not clear it"
            exit 1
          elif [ "$last" = "success" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous verdict on this commit; running the review."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch diff, strip lockfiles/generated files, apply budget
        id: go
        if: steps.mode.outputs.mode == 'review' || (steps.mode.outputs.mode == 'mirror' && steps.mirror.outputs.found == 'false')
        run: |
          dir="$RUNNER_TEMP/ssdlc"
          mkdir -p "$dir"
          raw="$dir/raw.diff"
          raw_changed=$(( ${ADDITIONS:-0} + ${DELETIONS:-0} ))
          if ! gh pr diff "$PR" --repo "$REPO" > "$raw" 2> "$dir/diff.err"; then
            cat "$dir/diff.err"
            echo "::notice title=SSDLC sanity::could not fetch the PR diff (usually too large for the GitHub diff API; $raw_changed changed lines); AI sanity check skipped, check passes"
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Lockfiles and generated files are noise for a sanity review and
          # blow the model's turn budget (qfg-30x6). They stay covered by the
          # deps job. Matching is on the file's basename.
          awk -v skipped="$dir/skipped.txt" -v countfile="$dir/count.txt" '
            function gen(p,  b) {
              b = p; sub(/.*\//, "", b)
              return (b ~ /^(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|go\.sum|poetry\.lock|Gemfile\.lock|Package\.resolved|packages\.lock\.json|bun\.lockb)$/ \
                || b ~ /\.lock$/ || b ~ /\.min\.(js|css)$/ || b ~ /\.(js|css)\.map$/)
            }
            /^diff --git / { p = $0; sub(/^diff --git a\/.* b\//, "", p); skip = gen(p); inhunk = 0; if (skip) print p > skipped }
            skip { next }
            { print }
            /^@@/ { inhunk = 1; next }
            inhunk && /^[+-]/ { n++ }
            END { print n + 0 > countfile }
          ' "$raw" > "$dir/pr.diff"
          changed=$(cat "$dir/count.txt")
          omitted=0
          if [ -s "$dir/skipped.txt" ]; then
            omitted=$(wc -l < "$dir/skipped.txt" | tr -d ' ')
            echo "Omitted $omitted lockfile/generated file(s) from the AI diff:"
            cat "$dir/skipped.txt"
          fi
          if [ "$changed" -eq 0 ]; then
            echo "::notice title=SSDLC sanity::no reviewable changed lines ($omitted lockfile/generated file(s) omitted); AI sanity check skipped, check passes"
            echo "review=false" >> "$GITHUB_OUTPUT"
          elif [ "$changed" -gt "$MAX_CHANGED_LINES" ]; then
            echo "::notice title=SSDLC sanity::diff is $changed reviewable changed lines (> $MAX_CHANGED_LINES); AI sanity check skipped, check passes"
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "Reviewable diff: $changed changed lines ($raw_changed raw, $omitted file(s) omitted); running the review."
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require ANTHROPIC_API_KEY
        if: steps.go.outputs.review == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            # pull_request runs from forks never receive secrets, by design.
            echo "::error title=SSDLC sanity::PR from fork $HEAD_REPO - the AI sanity check cannot run because GitHub does not pass secrets to fork PRs. A maintainer must review this PR by hand and then add the 'hotfix' label to pass this check (and post the justification it asks for)."
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=SSDLC sanity::ANTHROPIC_API_KEY secret is empty or not visible to $REPO. Set it as a repo secret (org secrets do not reach private repos on the GitHub Free plan) and make sure the caller passes 'secrets: inherit'. Add the 'hotfix' label to bypass."
            exit 1
          fi

      - name: Checkout PR
        if: steps.go.outputs.review == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve prompt
        if: steps.go.outputs.review == 'true'
        id: prompt_file
        uses: quonfig/ci/.github/actions/sanity-prompt@main

      - name: Build prompt and diff
        if: steps.go.outputs.review == 'true'
        id: prompt
        env:
          PROMPT_FILE: ${{ steps.prompt_file.outputs.path }}
          PROMPT_SOURCE: ${{ steps.prompt_file.outputs.source }}
        run: |
          # Inside the workspace so Claude's Read tool can open it. Copied after
          # checkout, which would otherwise clean it away.
          diff_file="$GITHUB_WORKSPACE/.ssdlc-pr.diff"
          cp "$RUNNER_TEMP/ssdlc/pr.diff" "$diff_file"
          # Hard byte cap as a second budget guard (huge generated lines).
          if [ "$(wc -c < "$diff_file")" -gt 200000 ]; then
            head -c 200000 "$diff_file" > "$diff_file.tmp" && mv "$diff_file.tmp" "$diff_file"
            printf '\n[diff truncated at 200000 bytes]\n' >> "$diff_file"
          fi
          echo "Prompt source: $PROMPT_SOURCE ($PROMPT_FILE)"
          {
            echo 'prompt<<SSDLC_PROMPT_EOF'
            cat "$PROMPT_FILE"
            echo
            echo "---"
            echo "Repository: $REPO, pull request #$PR."
            echo "The full unified diff is at: $diff_file"
            if [ -s "$RUNNER_TEMP/ssdlc/skipped.txt" ]; then
              echo "Lockfiles and generated files were removed from that diff (dependency changes are scanned by a separate job):"
              head -n 50 "$RUNNER_TEMP/ssdlc/skipped.txt" | sed 's/^/- /'
            fi
            echo "Read that file first. You may open other files in the checked-out repo for context, but stay brief."
            echo "Do not post comments or edit files. Write your review as your final answer in GitHub markdown,"
            echo "and make the very last line exactly one of: VERDICT: PASS, VERDICT: WARN, VERDICT: BLOCK"
            echo 'SSDLC_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude sanity check
        if: steps.go.outputs.review == 'true'
        id: claude
        # An AI/infrastructure failure (error_max_turns, API outage, ...) must
        # not fail the gate: the next step turns it into a WARN (qfg-30x6).
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools Read,Grep,Glob

      - name: Post findings and apply verdict
        if: steps.go.outputs.review == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          MODEL: ${{ inputs.model }}
        run: |
          review=""
          subtype=""
          if [ -n "$EXECUTION_FILE" ] && [ -s "$EXECUTION_FILE" ]; then
            review=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' "$EXECUTION_FILE" 2>/dev/null || true)
            subtype=$(jq -r '[.[] | select(.type == "result")] | last | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          verdict=$(printf '%s\n' "$review" | grep -oE 'VERDICT: (PASS|WARN|BLOCK)' | tail -n1 | awk '{print $2}' || true)
          incomplete=""
          if [ "$verdict" != "BLOCK" ] && [ "$CLAUDE_OUTCOME" != "success" ]; then
            # Only an explicit BLOCK fails. A run that did not finish
            # (error_max_turns, API error, ...) is an AI infrastructure
            # problem, reported as a non-blocking WARN (qfg-30x6).
            incomplete="${subtype:-claude-code-action $CLAUDE_OUTCOME}"
            verdict=WARN
          fi
          verdict=${verdict:-UNKNOWN}
          marker='<!-- ssdlc-sanity -->'
          body_file="$RUNNER_TEMP/ssdlc/comment.md"
          {
            echo "$marker"
            echo "### SSDLC sanity check: \`$verdict\`"
            echo
            if [ -n "$incomplete" ]; then
              echo "_The AI sanity check did not complete (\`$incomplete\`). This is an AI infrastructure issue, not a finding, so the check passes. Re-run the job for a review._"
            elif [ -n "$review" ]; then
              printf '%s\n' "$review"
            else
              echo "_The model returned no review text._"
            fi
            echo
            echo "<sub>Model: $MODEL, commit ${HEAD_SHA:0:7}. Only BLOCK fails this check. Add the \`hotfix\` label to override.</sub>"
          } > "$body_file"
          # One sticky comment per PR: update in place instead of piling up.
          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1 || true)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body_file" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body_file" > /dev/null
          fi
          echo "Verdict: $verdict"
          case "$verdict" in
            BLOCK)
              echo "::error title=SSDLC sanity::BLOCK verdict - see the PR comment. Fix, or add the 'hotfix' label to override."
              exit 1 ;;
            UNKNOWN)
              echo "::warning title=SSDLC sanity::no verdict line found in the model output; passing" ;;
            *)
              if [ -n "$incomplete" ]; then
                echo "::warning title=SSDLC sanity::AI sanity check did not complete ($incomplete); non-blocking WARN, check passes. Re-run the job for a review."
              else
                echo "::notice title=SSDLC sanity::$verdict"
              fi ;;
          esac

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cheap and deterministic: runs on every PR event, drafts and label
    # changes included (removing `hotfix` re-enforces the scan).
    if: github.event_name == 'pull_request'
    concurrency:
      group: ssdlc-secrets-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (matches the release's
      # gitleaks_8.30.1_checksums.txt). Bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HAS_HOTFIX: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}
    steps:
      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Resolve config from the base branch
        id: cfg
        run: |
          set -euo pipefail
          # Config and ignore files come from the BASE commit, never the PR, so
          # a PR cannot allowlist its own leak. Changes to .gitleaks.toml or
          # .gitleaksignore take effect once merged.
          cfg_dir="$RUNNER_TEMP/gitleaks-cfg"
          mkdir -p "$cfg_dir"
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" > "$cfg_dir/gitleaks.toml"
            echo "Using the repo's .gitleaks.toml from base ${BASE_SHA:0:7}"
          else
            printf '[extend]\nuseDefault = true\n' > "$cfg_dir/gitleaks.toml"
            echo "No .gitleaks.toml on base; using the gitleaks default rules"
          fi
          if git cat-file -e "$BASE_SHA:.gitleaksignore" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaksignore" > "$cfg_dir/.gitleaksignore"
            echo "Using the repo's .gitleaksignore from base ${BASE_SHA:0:7}"
          else
            : > "$cfg_dir/.gitleaksignore"
          fi
          echo "dir=$cfg_dir" >> "$GITHUB_OUTPUT"

      - name: Scan PR commits (base..head)
        env:
          CFG_DIR: ${{ steps.cfg.outputs.dir }}
        run: |
          set -uo pipefail
          range="${BASE_SHA}..${HEAD_SHA}"
          echo "Commits in range $range:"
          git log --oneline "$range"
          report="$RUNNER_TEMP/gitleaks-report.json"
          # Actions runs bash with -e; capture gitleaks' exit code instead of
          # letting a finding (exit 2) abort the step before reporting/hotfix.
          rc=0
          gitleaks git . \
            --log-opts="$range" \
            --config "$CFG_DIR/gitleaks.toml" \
            --gitleaks-ignore-path "$CFG_DIR/.gitleaksignore" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$report" \
            --exit-code 2 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=SSDLC secrets::no secrets found in the PR's commits"
            exit 0
          elif [ "$rc" -ne 2 ]; then
            echo "::error title=SSDLC secrets::gitleaks failed to run (exit $rc)"
            exit "$rc"
          fi
          count=$(jq 'length' "$report")
          # Secret values are redacted; report location only.
          jq -r '.[] | "\(.RuleID)\t\(.File)\t\(.StartLine)\t\(.Commit)"' "$report" |
            while IFS=$'\t' read -r rule file line commit; do
              if [ "$HAS_HOTFIX" = "true" ]; then level=warning; else level=error; fi
              echo "::$level file=$file,line=$line,title=SSDLC secrets::$rule in commit ${commit:0:7}"
            done
          fp_help="If this is a false positive: add the fingerprint to .gitleaksignore or an allowlist to .gitleaks.toml in a separate PR (base-branch config is used), or mark the line with a 'gitleaks:allow' comment."
          if [ "$HAS_HOTFIX" = "true" ]; then
            echo "::warning title=SSDLC secrets::$count finding(s) ignored because of the hotfix label. Rotate any real credential and remove it."
            exit 0
          fi
          echo "::error title=SSDLC secrets::$count potential secret(s) in this PR's commits. Remove them (rewrite the PR branch) and rotate any real credential. $fp_help Add the 'hotfix' label to override."
          echo "Fingerprints (for .gitleaksignore):"
          jq -r '.[].Fingerprint' "$report"
          exit 1

  deps:
    name: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deterministic, so it runs on every PR event like secrets (drafts and
    # label changes included: removing `hotfix` re-enforces the scan).
    if: github.event_name == 'pull_request' && inputs.deps
    concurrency:
      group: ssdlc-deps-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Scans the whole dependency tree at the PR head (not just the diff):
      # a newly published advisory shows up on the next PR in that repo.
      - name: Dependency vulnerability scan
        uses: quonfig/ci/.github/actions/deps-scan@main
        with:
          hotfix: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}
          enforce: ${{ inputs.deps_enforce }}

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deterministic, so it runs on every PR event like secrets and deps
    # (drafts and label changes included: removing `hotfix` re-enforces it).
    if: github.event_name == 'pull_request' && inputs.sast
    concurrency:
      group: ssdlc-sast-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Bump deliberately. The p/ci ruleset is fetched from the Semgrep
      # registry at run time (Semgrep CE: no account, no token).
      SEMGREP_VERSION: 1.179.0
      SEMGREP_CONFIG: p/ci
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HAS_HOTFIX: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}
    steps:
      - name: Checkout PR head (full history, for the merge base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep CE (pinned)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Scan (diff-aware) and apply policy
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -uo pipefail
          # Diff-aware: only findings this PR introduces relative to the merge
          # base are reported, so pre-existing findings never block a PR.
          # Exclusions: a root .semgrepignore (semgrep's own format; read from
          # the PR head, so a new entry is visible in the diff) and inline
          # `nosemgrep: <rule-id>` comments with a reason.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Merge base: $merge_base (base ${BASE_SHA:0:7}, head ${HEAD_SHA:0:7})"
          out="$RUNNER_TEMP/semgrep.json"
          rc=0
          semgrep scan --config "$SEMGREP_CONFIG" --metrics=off --disable-version-check \
            --baseline-commit "$merge_base" --json --output "$out" --quiet || rc=$?
          # Without --error semgrep exits 0 even with findings: non-zero means
          # the tool itself failed (registry unreachable, bad config, ...).
          if [ "$rc" -ne 0 ] || [ ! -s "$out" ]; then
            echo "::error title=SSDLC sast::semgrep failed to run (exit $rc). This is a tool error, not a finding; re-run the job, or add the 'hotfix' label to override."
            exit 2
          fi
          # Only ERROR fails (semgrep's newer HIGH/CRITICAL levels count as ERROR).
          # shellcheck disable=SC2016  # $s is a jq variable, not shell
          defs='def blk: (.extra.severity | ascii_upcase) as $s | ($s == "ERROR" or $s == "HIGH" or $s == "CRITICAL"); def clean: gsub("[|%\\r\\n]"; " ") | .[0:300];'
          blocking=$(jq "$defs"' [.results[] | select(blk)] | length' "$out")
          other=$(jq "$defs"' [.results[] | select(blk | not)] | length' "$out")
          parse_errors=$(jq '.errors | length' "$out")
          {
            echo "## SSDLC sast (Semgrep CE $SEMGREP_CONFIG, diff-aware against ${merge_base:0:7})"
            echo
            echo "- Blocking (ERROR) findings introduced by this PR: **$blocking**"
            echo "- Non-blocking (WARNING/INFO) findings introduced: $other"
            echo "- Files semgrep could not fully parse: $parse_errors (not a failure)"
            echo
            if [ "$((blocking + other))" -gt 0 ]; then
              echo "| Severity | Rule | Location | Message |"
              echo "|----------|------|----------|---------|"
              jq -r "$defs"' (.results | map(select(blk)) + map(select(blk | not)))[]
                | "| \(.extra.severity) | \(.check_id) | \(.path):\(.start.line) | \(.extra.message | clean) |"' "$out"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_HOTFIX" = "true" ]; then level=warning; else level=error; fi
          jq -r "$defs"' .results[] | select(blk) | [.path, (.start.line | tostring), .check_id, (.extra.message | clean)] | @tsv' "$out" |
            while IFS=$'\t' read -r file line rule msg; do
              echo "::$level file=$file,line=$line,title=SSDLC sast::$rule: $msg"
            done
          jq -r "$defs"' .results[] | select(blk | not) | "note: \(.extra.severity) \(.check_id) \(.path):\(.start.line)"' "$out"
          if [ "$blocking" -eq 0 ]; then
            echo "::notice title=SSDLC sast::no ERROR-severity findings introduced ($other non-blocking)"
            exit 0
          fi
          if [ "$HAS_HOTFIX" = "true" ]; then
            echo "::warning title=SSDLC sast::$blocking ERROR finding(s) not enforced because of the hotfix label"
            exit 0
          fi
          echo "::error title=SSDLC sast::$blocking ERROR-severity finding(s) introduced by this PR. Fix them, or for a false positive add a 'nosemgrep: <rule-id>' comment with a reason on the line (or a .semgrepignore entry). Add the 'hotfix' label to override."
          exit 1
