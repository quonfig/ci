# Gates quonfig/ci's own PRs with the same SSDLC checks every other repo uses.
# Other repos use the identical file but with
#   uses: quonfig/ci/.github/workflows/ssdlc.yml@main
name: ssdlc-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  ssdlc:
    uses: ./.github/workflows/ssdlc.yml
    # First-party workflow; it declares only ANTHROPIC_API_KEY. inherit is the
    # documented SSDLC caller contract (quonfig/ci README).
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    with:
      # quonfig/ci has no dependency manifests to scan.
      deps: false
      # THROWAWAY (qfg-30x6 verification, do not merge): force error_max_turns.
      max_turns: 1
