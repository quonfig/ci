# Code scanning: full Semgrep scan of the default branch, uploaded as SARIF to
# GitHub code scanning (the repo's Security tab).
#
# REPORT-ONLY. This never blocks a merge:
#   - it runs on push to main and on a schedule, never on pull_request, so it
#     attaches no check to any PR;
#   - it is not a required check in the main-ssdlc ruleset, and must not be
#     made one;
#   - the ruleset's "require code scanning results" rule stays off.
# Findings already on main show up as Security-tab alerts to triage; they do
# not freeze main. The merge gate is still the diff-aware `ssdlc / sast` job
# in ssdlc.yml, which only fails on findings a PR introduces.
#
# Public repos only. SARIF upload on a private repo needs paid GitHub Code
# Security, so the job is skipped there.
#
# Callers copy templates/code-scanning.yml. The scan runs here; the caller
# uploads the SARIF itself with `upload: false`, so each repo's own workflow
# file holds the upload step (Comp's Code Scanning check reads the repo's
# workflow files for it, and does not follow `uses:` into this repo). The
# caller grants `security-events: write` (a called workflow can only use
# permissions its caller grants).
name: code-scanning

on:
  workflow_call:
    inputs:
      upload:
        description: >-
          Upload the SARIF to code scanning from this workflow. Callers built
          from templates/code-scanning.yml pass false and upload it themselves
          from the `semgrep-sarif` artifact.
        type: boolean
        default: true
    outputs:
      sarif-artifact:
        description: Name of the SARIF artifact, or empty when the scan was skipped (private repo).
        value: ${{ jobs.semgrep.outputs.sarif-artifact }}

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.repository.private == false
    concurrency:
      group: code-scanning-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
      actions: read
    outputs:
      sarif-artifact: ${{ steps.artifact.outputs.name }}
    env:
      # Keep in step with SEMGREP_VERSION / SEMGREP_CONFIG in ssdlc.yml.
      SEMGREP_VERSION: 1.179.0
      SEMGREP_CONFIG: p/ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Semgrep CE (pinned)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Full scan to SARIF
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -uo pipefail
          # Full scan (no baseline): code scanning tracks every open finding on
          # the default branch. Honors the repo's .semgrepignore and inline
          # nosemgrep comments, like the PR gate (see the filter below).
          out="$RUNNER_TEMP/semgrep.sarif"
          rc=0
          semgrep scan --config "$SEMGREP_CONFIG" --metrics=off --disable-version-check \
            --sarif --output "$out" --quiet || rc=$?
          # Without --error semgrep exits 0 even with findings: non-zero means
          # the tool itself failed. Fail this (non-required) job so it is seen.
          if [ "$rc" -ne 0 ] || [ ! -s "$out" ]; then
            echo "::error title=code-scanning::semgrep failed to run (exit $rc)"
            exit 2
          fi
          # Drop results already suppressed in the code (inline nosemgrep with a
          # reason, reviewed in the PR that added it). GitHub ignores SARIF
          # `suppressions` and would show them as open alerts.
          suppressed=$(jq '[.runs[].results[] | select((.suppressions // []) | length > 0)] | length' "$out")
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' "$out" > "$out.tmp" && mv "$out.tmp" "$out"
          results=$(jq '[.runs[].results[]] | length' "$out")
          echo "::notice title=code-scanning::$results finding(s) uploaded to code scanning ($suppressed suppressed in code, not uploaded)"
          echo "sarif=$out" >> "$GITHUB_ENV"

      - name: Save SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: ${{ env.sarif }}
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact name
        id: artifact
        run: echo "name=semgrep-sarif" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: inputs.upload
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ env.sarif }}
          category: semgrep
